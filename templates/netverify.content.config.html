<!-- ============================================================
     netverify.content.config.html
     Configuration diff view: displays a hierarchical, collapsible
     diff of pre/post configurations with filterable change types
     (added, removed, changed, unchanged) and a side-by-side raw
     view pane for the original pre/post configuration text.
     ============================================================ -->

<!-- =============================================================
     STYLES
     ============================================================= -->
<style>
    /* -------------------- Layout shell -------------------- */
    .config-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .config-shell .content {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* -------------------- Diff pane -------------------- */
    .config-shell .diff-pane {
      flex: 1;
      overflow-y: auto;
    }

    /* =========================================================
       CARDS (hierarchical config sections)
       ========================================================= */
    .config-shell .card {
      --indent: calc(var(--depth) * 14px);
      margin: 10px 4px 10px var(--indent);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      position: relative;
    }

    /* Vertical hierarchy guide line drawn to the left of each card */
    .config-shell .card::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border-color);
    }

    /* Top-level cards have no parent guide line */
    .config-shell .card[data-depth="0"]::before {
      display: none;
    }

    /* -------------------- Card header -------------------- */
    .config-shell .card-header {
      background: var(--background-color-secondary);
      color: var(--text-color);
      font-weight: 600;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
    }

    .config-shell .toggle-icon {
      margin-right: 6px;
      transition: transform 0.2s ease;
    }

    .config-shell .card-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Collapsed-state visuals */
    .config-shell .card.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }

    .config-shell .card-body {
      padding: 4px 0;
    }

    .config-shell .card.collapsed .card-body {
      display: none;
    }

    /* -------------------- Card change states -------------------- */
    .config-shell .card.is-removed {
      border-color: var(--badge-error-color);
    }

    .config-shell .card.is-removed .card-header {
      background: var(--badge-error-bg);
      border-bottom-color: var(--badge-error-color);
      color: var(--badge-error-color);
    }

    .config-shell .card.is-added {
      border-color: var(--badge-info-color);
    }

    .config-shell .card.is-added .card-header {
      background: var(--badge-info-bg);
      border-bottom-color: var(--badge-info-color);
      color: var(--badge-info-color);
    }

    /* =========================================================
       ITEMS (individual diff lines)
       ========================================================= */
    .config-shell .item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      margin: 0 4px;
      border-left: 3px solid transparent;
      border-radius: 3px;
    }

    /* Added */
    .config-shell .item.is-added {
      background: var(--badge-info-bg);
      border-left-color: var(--badge-info-color);
    }

    .config-shell .item.is-added .material-icons {
      color: var(--badge-info-color);
    }

    /* Removed */
    .config-shell .item.is-removed {
      background: var(--badge-error-bg);
      border-left-color: var(--badge-error-color);
    }

    .config-shell .item.is-removed .material-icons {
      color: var(--badge-error-color);
    }

    /* Changed */
    .config-shell .item.is-changed {
      background: var(--badge-warning-bg);
      border-left-color: var(--badge-warning-color);
    }

    .config-shell .item.is-changed .material-icons {
      color: var(--badge-warning-color);
    }

    /* Unchanged */
    .config-shell .item.is-unchanged {
      background: var(--background-color);
      border-left-color: var(--border-color);
    }

    .config-shell .item.is-unchanged .material-icons {
      color: var(--text-muted);
    }

    /* -------------------- Inline diff highlighting -------------------- */
    .config-shell .diff-char {
      color: #d93025;
      background: #ffcccc;
      padding: 0 1px;
      border-radius: 2px;
    }

    .config-shell .arrow {
      margin: 0 8px;
    }

    /* =========================================================
       RAW PANE (side panel with pre/post original config text)
       ========================================================= */
    .config-shell .raw-pane {
      width: 40%;
      background: var(--background-color);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .config-shell .raw-pane.hidden {
      display: none;
    }

    .config-shell .raw-header {
      display: flex;
      align-items: center;
      background: var(--background-color-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .config-shell .raw-header button {
      font-size: var(--font-size-sm);
    }

    /* Raw pane tabs (Pre / Post) */
    .config-shell .raw-tab {
      border: none;
      background: none;
      padding: 12px;
      cursor: pointer;
      border-radius: 0;
    }

    .config-shell .raw-tab.active {
      border-bottom: 2px solid #0078d4;
      font-weight: 600;
    }

    .config-shell .raw-close {
      margin-left: auto;
      padding: 6px 10px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    /* Raw text content blocks */
    .config-shell .raw-content {
      flex: 1;
      background: var(--background-color);
      border-radius: 4px;
      color: var(--text-color);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.5;
      overflow: auto;
      padding: 10px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }

    .config-shell .raw-content.active {
      display: block;
    }
</style>

<!-- =============================================================
     MAIN CONFIG SHELL
     ============================================================= -->
<div class="config-shell">

    <!-- =====================================================
         TOOLBAR: filter buttons + expand/collapse + raw view
         ===================================================== -->
    <div class="toolbar">

        <!-- Diff type filter toggles -->
        <button class="icon-text filter-btn active" data-filter="is-added">
            <span class="material-icons">add</span>Added
        </button>
        <button class="icon-text filter-btn active" data-filter="is-removed">
            <span class="material-icons">remove</span>Removed
        </button>
        <button class="icon-text filter-btn active" data-filter="is-changed">
            <span class="material-icons">compare_arrows</span>Changed
        </button>
        <button class="icon-text filter-btn active" data-filter="is-unchanged">
            <span class="material-icons">equal</span>Same
        </button>

        <span class="sep"></span>

        <!-- Tree expansion controls -->
        <button class="icon-text active" id="expand-all">
            <span class="material-icons">expand_all</span>Expand All
        </button>
        <button class="icon-text" id="collapse-all">
            <span class="material-icons">collapse_all</span>Collapse All
        </button>

        <!-- Raw config viewer toggle -->
        <button class="icon-text" id="show-raw">
            <span class="material-icons">article</span>View Raw
        </button>

    </div>

    <!-- =====================================================
         CONTENT: diff pane + (optional) raw pane
         ===================================================== -->
    <div class="content">

        <!-- Hierarchical diff rendering (server-rendered HTML) -->
        <div class="diff-pane">
            {{ diff_html | safe }}
        </div>

        <!-- Raw config side pane (hidden by default) -->
        <div id="configRawPane" class="raw-pane hidden">

            <!-- Tabs to switch between pre and post raw text -->
            <div class="raw-header">
                <button class="raw-tab active" data-target="configRawPre">Pre</button>
                <button class="raw-tab" data-target="configRawPost">Post</button>
                <button id="close-raw" class="raw-close">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <!-- Raw text content blocks; only the active one is visible -->
            <pre id="configRawPre" class="raw-content active">{{ pre_config | e }}</pre>
            <pre id="configRawPost" class="raw-content">{{ post_config | e }}</pre>
        </div>
    </div>
</div>

<!-- =============================================================
     SCRIPTS
     - Card collapse/expand (individual + global)
     - Filter button toggles
     - Hide empty cards based on visible items
     - Raw pane visibility + tab switching
     ============================================================= -->
<script>
    (() => {

      const config = document.querySelector('.config-shell');
      if (!config) return;

      /* =====================================================
         SECTION TOGGLE (per-card collapse on header click)
         ===================================================== */
      config.querySelectorAll('.card-header').forEach(header => {
        header.addEventListener('click', () => {
          header.closest('.card').classList.toggle('collapsed');
        });
      });

      /* =====================================================
         EXPAND / COLLAPSE ALL
         ===================================================== */
      const expandBtn = config.querySelector('#expand-all');
      const collapseBtn = config.querySelector('#collapse-all');

      expandBtn.onclick = () => {
        config.querySelectorAll('.card')
          .forEach(c => c.classList.remove('collapsed'));

        expandBtn.classList.add('active');
        collapseBtn.classList.remove('active');
      };

      collapseBtn.onclick = () => {
        config.querySelectorAll('.card')
          .forEach(c => c.classList.add('collapsed'));

        collapseBtn.classList.add('active');
        expandBtn.classList.remove('active');
      };

      /* =====================================================
         FILTER TOGGLE BUTTONS
         Show/hide diff items based on which change-type
         filters are currently active.
         ===================================================== */
      function applyFilters() {
        const enabled = new Set(
          Array.from(config.querySelectorAll('.filter-btn.active'))
            .map(btn => btn.dataset.filter)
        );

        config.querySelectorAll('.item').forEach(item => {
          const visible = [...item.classList].some(cls => enabled.has(cls));
          item.style.display = visible ? '' : 'none';
        });

        updateCardVisibility();
      }

      config.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          applyFilters();
        });
      });

      /* =====================================================
         HIDE EMPTY CARDS
         Cards with no visible items are hidden entirely.
         ===================================================== */
      function updateCardVisibility() {
        config.querySelectorAll('.card').forEach(card => {
          const visibleItems = card.querySelectorAll('.item:not([style*="display: none"])');
          card.style.display = visibleItems.length ? '' : 'none';
        });
      }

      // Initial filter application
      applyFilters();

      /* =====================================================
         RAW PANE TOGGLE
         ===================================================== */
      const rawPane = config.querySelector('#configRawPane');
      const showRawBtn = config.querySelector('#show-raw');
      const closeRawBtn = config.querySelector('#close-raw');

      showRawBtn.onclick = () => {
        rawPane.classList.toggle('hidden');
        if (!rawPane.classList.contains('hidden')) {
          showRawBtn.classList.add('active');
        } else {
          showRawBtn.classList.remove('active');
        }
      };

      closeRawBtn.onclick = () => {
        rawPane.classList.add('hidden');
        showRawBtn.classList.remove('active');
      };

      /* =====================================================
         RAW TABS (Pre / Post)
         ===================================================== */
      config.querySelectorAll('.raw-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          // Deactivate all tabs and content panels
          config.querySelectorAll('.raw-tab').forEach(t => t.classList.remove('active'));
          config.querySelectorAll('.raw-content').forEach(c => c.classList.remove('active'));

          // Activate selected tab and its target content
          tab.classList.add('active');
          const target = document.getElementById(tab.dataset.target);
          if (target) target.classList.add('active');
        });
      });

    })();
</script>
